name: Publish pplx-decider-flash-v1.3 weights

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Upstream Hugging Face revision (resolved to immutable commit SHA)
        type: string
        required: true
        default: d06fb3f2d97e0a52325a0d463c450cf0338f44fe
      tag:
        description: GitHub release tag
        type: string
        required: true
        default: pplx-decider-flash-v1.3

permissions:
  contents: write

concurrency:
  group: pplx-weight-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install publisher requirements
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.30,<2' 'requests>=2.32,<3'
      - name: Test packaging and restore
        run: python -m unittest discover -s tests -v
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from stream_release import find_release
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          existing = find_release(repo, tag)
          if existing is not None:
              if not existing.get("draft"):
                  raise SystemExit("Existing release is already published; refusing to overwrite.")
              print(f"Resuming existing draft release {tag} with {len(existing.get('assets', []))} assets")
          else:
              subprocess.run([
                  "gh", "release", "create", tag, "--draft",
                  "--target", os.environ["GITHUB_SHA"], "--repo", repo,
                  "--title", "Perplexity pplx-decider-flash-v1.3 model weight mirror",
                  "--notes", "Unmodified upstream snapshot: https://huggingface.co/perplexity-ai/pplx-decider-flash-v1.3. Apache-2.0; see included license, model card, and manifest for hashes."
              ], check=True)
          PY
      - name: Stream upstream files to release chunks
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REVISION: ${{ inputs.revision }}
          TAG: ${{ inputs.tag }}
        run: |
          python scripts/stream_release.py \
            --repo perplexity-ai/pplx-decider-flash-v1.3 \
            --revision "$REVISION" \
            --out dist --chunk-mib 1024 \
            --release-tag "$TAG"
      - name: Publish fully uploaded release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
